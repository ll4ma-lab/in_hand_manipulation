allegro:
# robot_interface parameters:
  root_links:
    - palm_link
    - palm_link
    - palm_link
    - palm_link

  tip_links:
    - index_tip
    - middle_tip
    - ring_tip
    - thumb_tip

  jnt_cmd_topic: /allegro_hand_right/joint_cmd

# controller parameters:
  compensate_gravity: false
  jnt_state_topic: /allegro_hand_right/joint_states
  torque_limits:
    # these are artificially high values for sim, can change to be realistic if you want
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6

# control_interaface parameters:
  tactile_enabled: true
  hand_command_srv: hand_service
  goal_threshold: 0.1 # radians
  cmd_timeout: 2 # seconds
  grasp_timesteps: 1500
  link_contact_thresh: 1.0e-2 #  
  grasp_delta_v: 0.003 # 
  stiffness_delta: 0.005 #
  approach_vel: 0.001 # radians per second
  
# Biotac parameters:
  
  tactile_sub_topic: /biotac/force_data
  tactile_tare_srv: /biotac/update_tare
  tactile_contact_probability: 0.2
  
  stiffness:
