    - "middle_joint_3"
    - "ring_joint_0"
    - "ring_joint_1"
    - "ring_joint_2"
    - "ring_joint_3"
    - "thumb_joint_0"
    - "thumb_joint_1"
    - "thumb_joint_2"
    - "thumb_joint_3"
